<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WishTrack</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 16px;
      font-weight: bold;
      color: #2563eb;
    }
    .badge {
      font-size: 11px;
      background: #dbeafe;
      color: #1e40af;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 500;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      box-sizing: border-box;
      background: #ffffff;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status-msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .status-msg.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      display: block;
    }
    .status-msg.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">WishTrack</span>
    <span class="badge" id="hostBadge">Detecting...</span>
  </div>

  <div id="statusAlert" class="status-msg"></div>

  <form id="addItemForm">
    <div class="form-group">
      <label>Product Title</label>
      <input type="text" id="titleInput" required placeholder="Product Title">
    </div>

    <div class="form-group" style="display: flex; gap: 8px;">
      <div style="flex: 1;">
        <label>Current Price (<span id="currLabel">INR</span>)</label>
        <input type="number" step="0.01" min="0" id="priceInput" placeholder="Price">
      </div>
      <div style="flex: 1;">
        <label>Target Price</label>
        <input type="number" step="0.01" min="0" id="targetPriceInput" placeholder="Target">
      </div>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="notesInput" placeholder="e.g. Size L, Black">
    </div>

    <button type="submit" id="submitBtn" class="btn">Add to Wishlist</button>
  </form>

  <script type="module" src="src/popup/popup.js"></script>
</body>
</html>
